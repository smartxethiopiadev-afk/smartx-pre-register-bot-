name = "smartx-pre-register-bot"
main = "worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

# Optional: Cloudflare D1 database (Uncomment if you create a D1 database with: wrangler d1 create smartx_db)
# [[d1_databases]]
# binding = "DB"
# database_name = "smartx_db"
# database_id = "your_d1_database_id_here"

# Note: Set your secrets via Wrangler CLI or Cloudflare Dashboard:
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put GEMINI_API_KEY
# wrangler secret put ADMIN_IDS
